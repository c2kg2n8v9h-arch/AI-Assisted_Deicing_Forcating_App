[project]
name = "airport-deicing-operations"
version = "0.1.0"
description = "Predictive airport deicing operations workflow"
requires-python = ">=3.10"
dependencies = [
	"fastapi>=0.115,<1.0",
	"uvicorn[standard]>=0.30,<1.0",
	"python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
	"pytest>=8.0,<10.0",
	"ruff>=0.6,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"] # FastAPI dependency declarations intentionally call Depends.

[tool.unittest]
test-dir = "tests"
