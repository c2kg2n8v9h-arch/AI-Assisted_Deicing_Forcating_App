name: Set up automation workspace
description: Install the pinned Node.js and pnpm toolchain with a frozen lockfile

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/setup@v2

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install locked dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --strict-peer-dependencies

    - name: Display tool versions
      shell: bash
      run: |
        node --version
        pnpm --version
